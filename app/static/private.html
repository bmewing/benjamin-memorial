<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What has come in</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #14332d; --sepia: #6b5747; --sage: #a9b4a6;
    --ground: #e8e7df; --card: #f4f3ee; --ink: #2a2621;
    --line: #d3d2c8; --line-soft: #dedcd3;
    --serif: "Newsreader", Georgia, serif;
    --sans: "Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--serif); font-size: 17px; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px 90px; }

  header { text-align: center; padding: 52px 0 30px; }
  h1 {
    font-family: var(--serif); font-weight: 300; font-size: 2.2rem;
    color: var(--pine); margin: 0 0 8px;
  }
  .sub {
    font-family: var(--sans); font-size: .74rem; font-weight: 600;
    letter-spacing: .15em; text-transform: uppercase; color: var(--sepia);
    margin: 0;
  }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: center;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 14px 0; margin-bottom: 34px;
  }
  .count { font-family: var(--sans); font-size: .8rem; color: var(--sepia); }
  .filter {
    font-family: var(--sans); font-size: .7rem; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    background: none; border: 1px solid var(--line); color: var(--sepia);
    padding: 8px 14px; cursor: pointer;
  }
  .filter[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--card); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
  }
  figure {
    margin: 0; background: var(--card); border: 1px solid var(--line-soft);
    display: flex; flex-direction: column;
  }
  figure a.shot { display: block; }
  figure img, figure video {
    display: block; width: 100%; aspect-ratio: 1; object-fit: cover;
    background: #dcdbd2;
  }
  figcaption { padding: 14px 15px 15px; }
  .who {
    font-family: var(--sans); font-size: .72rem; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--pine);
    margin: 0 0 5px;
  }
  .said { margin: 0 0 9px; font-size: .98rem; line-height: 1.55; }
  .said.none { color: var(--sepia); font-style: italic; opacity: .7; }
  .meta {
    font-family: var(--sans); font-size: .68rem; color: var(--sepia);
    letter-spacing: .04em; margin: 0; opacity: .85;
  }
  .tag {
    display: inline-block; font-family: var(--sans); font-size: .6rem;
    font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    border: 1px solid var(--sage); color: var(--sepia);
    padding: 1px 6px; margin-left: 6px;
  }
  /* A message has no photograph, so the words themselves are the item. The
     card is deliberately taller and quieter than a photo card -- something to
     read, not something to scan past. */
  figure.message { background: #f6f5f0; }
  .letter {
    padding: 22px 20px 4px; position: relative;
    font-size: 1.06rem; line-height: 1.62;
  }
  .letter .body { margin: 0; white-space: pre-wrap; }
  .letter .quiet {
    font-family: var(--sans); font-size: .62rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--sage);
    margin: 0 0 10px;
  }
  figure.message figcaption { padding-top: 10px; }
  figure.message .said { display: none; }

  /* Hurtful words should not be readable at a glance either. */
  .letter.covered .body { filter: blur(6px); user-select: none; }
  .cover {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; text-align: center;
    padding: 16px; background: rgba(232,231,223,.86); cursor: pointer;
  }
  .letter.shown .cover { display: none; }
  .letter.shown .body { filter: none; user-select: auto; }

  figure.flagged a.shot { position: relative; }
  figure.flagged img, figure.flagged video { filter: blur(22px); }
  .veil {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; text-align: center;
    padding: 16px; background: rgba(232,231,223,.72);
  }
  .veil strong, .cover strong {
    font-family: var(--sans); font-size: .68rem; font-weight: 600;
    letter-spacing: .13em; text-transform: uppercase; color: #8a3f32;
  }
  .veil span, .cover span {
    font-family: var(--sans); font-size: .76rem; color: var(--sepia); line-height: 1.5;
  }
  .veil em, .cover em { font-family: var(--sans); font-size: .66rem; font-style: normal;
             letter-spacing: .1em; text-transform: uppercase; color: var(--pine); }
  figure.shown .veil { display: none; }
  figure.shown img, figure.shown video { filter: none; }

  .why {
    font-family: var(--sans); font-size: .74rem; line-height: 1.5;
    color: #8a3f32; margin: 0 0 8px;
  }
  .pending {
    font-family: var(--sans); font-size: .66rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--sepia); opacity: .7; margin: 0 0 6px;
  }

  .acts {
    display: flex; gap: 8px; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--line-soft);
  }
  .act {
    flex: 1; font-family: var(--sans); font-size: .66rem; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
    background: none; border: 1px solid var(--line); color: var(--sepia);
    padding: 8px 6px; transition: border-color .15s ease, color .15s ease;
  }
  .act:hover { border-color: var(--pine); color: var(--pine); }
  .act.keep[disabled] { opacity: .5; cursor: default; border-color: var(--line); color: var(--sepia); }
  .act.danger:hover { border-color: #8a3f32; color: #8a3f32; }
  .act.arming { border-color: #8a3f32; color: #8a3f32; background: rgba(138,63,50,.07); }
  .act.busy { opacity: .55; cursor: default; }
  figure.gone { opacity: .35; }
  figure.gone .acts { display: none; }
  .gonemsg {
    font-family: var(--sans); font-size: .68rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--sepia); margin: 12px 0 0;
    padding-top: 12px; border-top: 1px solid var(--line-soft);
  }

  .state {
    text-align: center; color: var(--sepia); padding: 70px 0;
    font-size: 1.1rem;
  }
  .note {
    font-family: var(--sans); font-size: .78rem; color: var(--sepia);
    text-align: center; margin-top: 40px; opacity: .8;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>What has come in</h1>
    <p class="sub">For Benjamin &middot; private</p>
  </header>

  <div class="bar">
    <span class="count" id="count">Loading&hellip;</span>
    <button class="filter" id="f-all"  aria-pressed="true">Everything</button>
    <button class="filter" id="f-sms"  aria-pressed="false">Texted</button>
    <button class="filter" id="f-web"  aria-pressed="false">Uploaded</button>
    <button class="filter" id="f-msg"  aria-pressed="false">Words only</button>
    <button class="filter" id="f-flag" aria-pressed="false">Needs a look</button>
  </div>

  <div class="grid" id="grid"></div>
  <p class="state" id="state" hidden></p>

  <p class="note">
    Links here expire after a few hours &mdash; reload the page for fresh ones.
    Run <code>scripts/download_all.py</code> to keep your own copy.
  </p>

</div>

<script>
const KEY   = new URLSearchParams(location.search).get('key') || '';
const grid  = document.getElementById('grid');
const state = document.getElementById('state');
const count = document.getElementById('count');
let items = [];
let filter = 'all';

function say(msg) { state.hidden = false; state.textContent = msg; }

function when(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
  });
}

function phone(raw) {
  const m = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(raw || '');
  return m ? `(${m[1]}) ${m[2]}-${m[3]}` : raw;
}

const flagged = i => i.concern === 'serious' || i.concern === 'review';

function draw() {
  const shown = items.filter(i =>
    filter === 'all'  ? true :
    filter === 'flag' ? flagged(i) :
    filter === 'msg'  ? i.kind === 'message' :
                        i.source === filter);
  count.textContent = shown.length + (shown.length === 1 ? ' item' : ' items');
  grid.innerHTML = '';

  if (!shown.length) { say('Nothing here yet.'); return; }
  state.hidden = true;

  for (const i of shown) {
    const fig = document.createElement('figure');
    if (flagged(i)) fig.className = 'flagged';

    // Words with no photo: print them, and cover them first if the screener
    // was unhappy. There is nothing to link out to, so no anchor at all.
    if (i.kind === 'message') {
      fig.classList.add('message');
      const letter = document.createElement('div');
      letter.className = flagged(i) ? 'letter covered' : 'letter';

      const label = document.createElement('p');
      label.className = 'quiet';
      label.textContent = 'Written';
      const body = document.createElement('p');
      body.className = 'body';
      body.textContent = i.caption;
      letter.append(label, body);

      if (flagged(i)) {
        const cover = document.createElement('div');
        cover.className = 'cover';
        const strong = document.createElement('strong');
        strong.textContent = i.concern === 'serious' ? 'Flagged' : 'Worth a look';
        const why = document.createElement('span');
        why.textContent = i.review_note || (i.flags || []).join(', ') || 'Unclear.';
        const em = document.createElement('em');
        em.textContent = 'Click to read';
        cover.append(strong, why, em);
        cover.addEventListener('click', () => letter.classList.add('shown'));
        letter.appendChild(cover);
      }

      fig.appendChild(letter);
      fig.appendChild(caption(i, fig));
      grid.appendChild(fig);
      continue;
    }

    const a = document.createElement('a');
    a.className = 'shot';
    a.href = i.url;
    a.target = '_blank';
    a.rel = 'noopener';
    if (i.kind === 'video') {
      const v = document.createElement('video');
      v.src = i.url; v.controls = true; v.preload = 'metadata';
      a.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = i.url; img.loading = 'lazy'; img.alt = '';
      a.appendChild(img);
    }
    // Anything the screening model was unhappy about stays covered until it
    // is deliberately uncovered. Nothing is hidden from you, only from a
    // glance you did not choose to take.
    if (flagged(i)) {
      const veil = document.createElement('div');
      veil.className = 'veil';
      const label = document.createElement('strong');
      label.textContent = i.concern === 'serious' ? 'Flagged' : 'Worth a look';
      const why = document.createElement('span');
      why.textContent = i.review_note || (i.flags || []).join(', ') || 'Unclear.';
      const act = document.createElement('em');
      act.textContent = 'Click to show';
      veil.append(label, why, act);
      veil.addEventListener('click', ev => {
        ev.preventDefault();
        fig.classList.add('shown');
      });
      a.appendChild(veil);
    }

    fig.appendChild(a);
    fig.appendChild(caption(i, fig));
    grid.appendChild(fig);
  }
}

// Who sent it, what they said, when, and the keep/remove pair. Shared, so a
// message is acted on exactly the way a photo is.
function caption(i, fig) {
    const cap = document.createElement('figcaption');

    if (flagged(i) && i.review_note) {
      const why = document.createElement('p');
      why.className = 'why';
      why.textContent = i.review_note;
      cap.appendChild(why);
    } else if (i.concern === 'unreviewed') {
      const pend = document.createElement('p');
      pend.className = 'pending';
      pend.textContent = 'Not screened';
      cap.appendChild(pend);
    }

    const who = document.createElement('p');
    who.className = 'who';
    who.textContent = i.from ? (i.source === 'sms' ? phone(i.from) : i.from) : 'Not signed';
    cap.appendChild(who);

    const said = document.createElement('p');
    said.className = i.caption ? 'said' : 'said none';
    said.textContent = i.caption || 'No message';
    cap.appendChild(said);

    const meta = document.createElement('p');
    meta.className = 'meta';
    meta.textContent = when(i.when);
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = i.source === 'sms' ? 'texted' : 'uploaded';
    meta.appendChild(tag);
    if (i.kind === 'message') {
      const only = document.createElement('span');
      only.className = 'tag';
      only.textContent = 'no photo';
      meta.appendChild(only);
    }
    cap.appendChild(meta);

    // Deciding about a photo is a person's job; the screener only sorts the
    // queue. Keep is one click, removing takes two.
    const acts = document.createElement('div');
    acts.className = 'acts';

    const keep = document.createElement('button');
    keep.className = 'act keep';
    keep.textContent = flagged(i) ? 'This is fine' : 'Fine';
    keep.disabled = !flagged(i);
    keep.addEventListener('click', () => act(keep, '/api/item/keep', i, fig, () => {
      i.concern = 'none'; i.flags = []; i.review_note = '';
      draw();
    }));

    const del = document.createElement('button');
    del.className = 'act danger';
    del.textContent = 'Remove';
    let armed = false;
    del.addEventListener('click', () => {
      if (!armed) {
        armed = true;
        del.textContent = 'Really remove?';
        del.classList.add('arming');
        setTimeout(() => {
          if (!armed) return;
          armed = false; del.textContent = 'Remove'; del.classList.remove('arming');
        }, 5000);
        return;
      }
      armed = false;
      act(del, '/api/item/remove', i, fig, () => {
        fig.classList.add('gone');
        const msg = document.createElement('p');
        msg.className = 'gonemsg';
        msg.textContent = 'Removed';
        cap.appendChild(msg);
        items = items.filter(x => x.key !== i.key);
        count.textContent = items.length + (items.length === 1 ? ' item' : ' items');
        refreshFlagCount();
      });
    });

    acts.append(keep, del);
    cap.appendChild(acts);

    return cap;
}

async function act(btn, url, item, fig, done) {
  btn.classList.add('busy');
  btn.disabled = true;
  try {
    const r = await fetch(url + '?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({item: item.key})
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    done();
  } catch (err) {
    btn.classList.remove('busy');
    btn.disabled = false;
    btn.textContent = 'Did not work';
    setTimeout(() => { btn.textContent = url.endsWith('keep') ? 'This is fine' : 'Remove'; }, 2500);
  }
}

function refreshFlagCount() {
  const n = items.filter(flagged).length;
  document.getElementById('f-flag').textContent =
    n ? 'Needs a look · ' + n : 'Needs a look';
}

for (const [id, val] of [['f-all','all'], ['f-sms','sms'], ['f-web','web'],
                         ['f-msg','msg'], ['f-flag','flag']]) {
  document.getElementById(id).addEventListener('click', () => {
    filter = val;
    for (const other of ['f-all','f-sms','f-web','f-msg','f-flag']) {
      document.getElementById(other).setAttribute('aria-pressed', String(other === id));
    }
    draw();
  });
}

(async () => {
  try {
    const r = await fetch('/api/gallery?key=' + encodeURIComponent(KEY));
    if (!r.ok) { say('That link is not valid.'); count.textContent = ''; return; }
    items = (await r.json()).items;
    refreshFlagCount();
    draw();
  } catch (err) {
    say('Could not load. Try reloading.');
    count.textContent = '';
  }
})();
</script>
</body>
</html>
